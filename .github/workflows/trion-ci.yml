# TRION CI — build/lint/test gate for the TRION workspace (TR-P4-070).
# Lives at the repo root because GitHub Actions requires it; scoped to
# TRION/** so it never runs for upstream K-Bot changes. This file is a
# deliberate exception to the "all Trion code under TRION/" rule
# (see TRION/AGENT_GUIDE.md).
name: TRION CI

on:
  push:
    branches: [Trion]
    paths: ['TRION/**', '.github/workflows/trion-ci.yml']
  pull_request:
    paths: ['TRION/**', '.github/workflows/trion-ci.yml']

jobs:
  rust:
    name: fmt + clippy + test (TRION/src)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TRION/src
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: TRION/src
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (requirement-traced)
        run: cargo test
      - name: Walking-skeleton demo (Phase 0 exit criteria)
        run: cargo run --bin walking_skeleton

  simulation:
    name: MuJoCo W1 smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - name: Hydrate nested K-Bot LFS assets
        run: git -C ksim-kbot/ksim_kbot/kscale-assets lfs pull
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MuJoCo bindings
        run: python -m pip install 'mujoco==3.1.6'
      - name: Load and step W1 headlessly
        run: python TRION/sim/load_scene.py --steps 2000
      - name: Compose pinned K-Bot with W1
        run: python TRION/sim/compose_w1_kbot.py --steps 100
